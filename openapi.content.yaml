                $ref: '#/components/schemas/ErrorEnvelope'
      security:
      - ContentAccessToken: []
components:
  schemas:
    Bloom:
      properties:
        level:
          type: string
          enum:
          - Nhớ
          - Hiểu
          - Áp dụng
          - Phân tích
          - Đánh giá
          - Sáng tạo
          title: Level
        conf:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Conf
      additionalProperties: false
      type: object
      required:
      - level
      title: Bloom
    Decision:
      properties:
        row_version:
          type: integer
          minimum: 1.0
          title: Row Version
        purpose:
          type: string
          enum:
          - classification
          - content
          title: Purpose
        decision:
          type: string
          enum:
          - accept
          - revise
          - reject
          title: Decision
        comment:
          type: string
          maxLength: 4000
          minLength: 1
          title: Comment
      additionalProperties: false
      type: object
      required:
      - row_version
      - purpose
      - decision
      - comment
      title: Decision
    Domain:
      properties:
        id:
          type: string
          maxLength: 20
          title: Id
        conf:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Conf
      additionalProperties: false
      type: object
      required:
      - id
      title: Domain
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message_vi:
          type: string
          title: Message Vi
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message_vi
      title: ErrorDetail
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorEnvelope
    Issue:
      properties:
        id:
          type: integer
          title: Id
        primary:
          type: boolean
          title: Primary
        conf:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Conf
      additionalProperties: false
      type: object
      required:
      - id
      - primary
      title: Issue
    Login:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 1024
          minLength: 1
          title: Password
      additionalProperties: false
      type: object
      required:
      - username
      - password
      title: Login
    Proposal:
      properties:
        row_version:
          type: integer
          minimum: 1.0
          title: Row Version
        taxonomy_version:
          type: string
          maxLength: 100
          title: Taxonomy Version
        tags:
          $ref: '#/components/schemas/Tags'
      additionalProperties: false
      type: object
      required:
      - row_version
      - taxonomy_version
      - tags
      title: Proposal
    Refresh:
      properties:
        refresh_token:
          type: string
          maxLength: 256
          minLength: 1
          title: Refresh Token
      additionalProperties: false
      type: object
      required:
      - refresh_token
      title: Refresh
    ReleaseInput:
      properties:
        version:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$
          title: Version
        chunk_ids:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 5000
          minItems: 1
          title: Chunk Ids
      additionalProperties: false
      type: object
      required:
      - version
      - chunk_ids
      title: ReleaseInput
    Tags:
      properties:
        van_de:
          items:
            $ref: '#/components/schemas/Issue'
          type: array
          maxItems: 3
          minItems: 1
          title: Van De
        mien:
          items:
            $ref: '#/components/schemas/Domain'
          type: array
          maxItems: 2
          minItems: 1
          title: Mien
        bloom_ceiling:
          $ref: '#/components/schemas/Bloom'
        content_type:
          type: string
          maxLength: 50
          title: Content Type
        population:
          items:
            type: string
          type: array
          maxItems: 3
          title: Population
        ly_do:
          type: string
          maxLength: 6000
          title: Ly Do
          default: ''
      additionalProperties: false
      type: object
      required:
      - van_de
      - mien
      - bloom_ceiling
      - content_type
      title: Tags
  securitySchemes:
    ContentAccessToken:
      type: http
      scheme: bearer
