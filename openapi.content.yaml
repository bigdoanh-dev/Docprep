          - type: string
          - type: 'null'
          title: Reason
      - name: revision_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Revision Id
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 25
          title: Limit
      responses:
        '200':
          description: Paginated chunks and their effective acceptance policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        classification_policy:
                          type:
                          - string
                          - 'null'
                          description: 'Effective decision policy: human-v1 or temporary
                            source-baseline-v1; null if not accepted.'
                        content_policy:
                          type:
                          - string
                          - 'null'
                          description: 'Effective decision policy: human-v1 or temporary
