    get:
      summary: Chunks
      operationId: chunks_v1_chunks_get
      security:
      - ContentAccessToken: []
      parameters:
      - name: classification
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - classified
            - unclassified
            type: string
          - type: 'null'
          title: Classification
      - name: document
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Document
      - name: issue
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Issue
      - name: reason
        in: query
        required: false
