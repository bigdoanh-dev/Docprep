# The HĐYKQG exam blueprint for preventive medicine, transcribed from docs/reference/core_issues.md.
# Names are the official text; short_name is a display label written for this project.
# Core issues 20 and 21 are read as group 4: the source note asks for a check against the original
# (docs/handover/09-open-issues.md, issue 25).
groups:
