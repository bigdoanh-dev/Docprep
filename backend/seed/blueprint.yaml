# Components are numbered 1–13 in the order they appear here.
competencies:
  - id: 1
    name: "Áp dụng khái niệm cơ bản của y học và y học dự phòng"
    weight_min: 18
    weight_max: 22
    components:
      - "Áp dụng khái niệm cơ bản của y học"
      - "Áp dụng khái niệm cơ bản của y học dự phòng"
  - id: 2
    name: "Chẩn đoán cấp ban đầu"
    weight_min: 37
    weight_max: 43
    components:
      - "Bệnh sử/tiền sử/thăm khám thực thể"
      - "Cận lâm sàng/xét nghiệm chẩn đoán"
      - "Chẩn đoán"
      - "Tiên lượng/kết cục"
  - id: 3
    name: "Xử trí cấp ban đầu"
    weight_min: 32
    weight_max: 38
    components:
      - "Duy trì sức khỏe/phòng bệnh"
      - "Điều trị bằng thuốc"
      - "Can thiệp lâm sàng"
      - "Quản lý ca bệnh"
  - id: 4
    name: "Cộng tác và Giao tiếp"
    weight_min: 4
    weight_max: 6
    components:
      - "Giao tiếp người bệnh và người nhà"
      - "Giao tiếp đồng nghiệp"
      - "Cộng tác liên ngành"

