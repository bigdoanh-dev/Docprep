# Demo fixture: status 'approved' set by seed, not by expert review.
# Stopgap content: blueprint tags are provisional and not expert-reviewed.
# Học phần are the eight blueprint groups (g1–g8, from seed/blueprint.yaml); this file only attaches
# units to them. A học phần with no units here is shown as "Sắp có".
# The stopgap units teach basic epidemiology under the foundation topic FND, placed in học phần 1.
- module: g1
  extra_competency_codes: [FND]
  units:
    - id: u-dt-01
      topic: Đo lường tần suất bệnh
      competency_code: FND
      items:
        - id: u1-c1
          kind: content
          content:
            id: ci-dt-01
            title: Tỷ lệ hiện mắc
            sources: [dt-p01]
            body: |
              Bao nhiêu người **đang mắc bệnh** trong quần thể tại một thời điểm — cả ca cũ lẫn ca mới.

              > **Tỷ lệ hiện mắc** = số người đang mắc ÷ tổng số người tại thời điểm đó
        - {id: u1-q1, kind: quiz, question: q-dt-01}
        - id: u1-r1
          kind: remediation
          after: u1-q1
          note: hãy xem lại mẫu số
          content:
            id: ci-dt-01r
            title: Ví dụ · Tính từng bước
            sources: [dt-p01]
            body: |
              1. Tử số: **50** người đang mắc
              2. Mẫu số: **2.000** dân tại ngày 1/1
              3. 50 ÷ 2.000 = 0,025 = **2,5%**
        - id: u1-c2
          kind: content
          content:
            id: ci-dt-02
            title: Tỷ lệ mới mắc
            sources: [dt-p02]
            body: |
              Chỉ đếm **ca mới** xuất hiện trong một khoảng thời gian, trên quần thể có nguy cơ.

              > **Tỷ lệ mới mắc** = số ca mới trong khoảng thời gian ÷ quần thể có nguy cơ
        - {id: u1-q2, kind: quiz, question: q-dt-02}
        - id: u1-c3
          kind: content
          content:
            id: ci-dt-03
            title: Liên quan giữa hiện mắc và mới mắc
            sources: [dt-p03]
            body: |
              Khi bệnh ổn định, tỷ lệ hiện mắc xấp xỉ bằng tỷ suất mới mắc nhân với thời gian mắc bệnh trung bình.

              > **P ≈ I × D**

              Bệnh kéo dài hơn thì hiện mắc tăng, dù số ca mới không đổi.
        - {id: u1-q3, kind: quiz, question: q-dt-03}
    - id: u-dt-02
      topic: Đo lường kết hợp và sàng lọc
      competency_code: FND
      items:
        - id: u2-c1
          kind: content
          content:
            id: ci-dt-04
            title: Nguy cơ tương đối và tỷ suất chênh
            sources: [dt-p06, dt-p07]
            body: |
              **Nguy cơ tương đối (RR)** = tỷ lệ mới mắc ở nhóm phơi nhiễm ÷ tỷ lệ mới mắc ở nhóm không phơi nhiễm.

              Nghiên cứu bệnh–chứng không đo được tỷ lệ mới mắc, nên dùng **tỷ suất chênh (OR)**.

              > **OR** = (a × d) ÷ (b × c)
        - {id: u2-q1, kind: quiz, question: q-dt-04}
        - {id: u2-q2, kind: quiz, question: q-dt-05}
        - id: u2-c2
          kind: content
          content:
            id: ci-dt-05
            title: Độ nhạy và độ đặc hiệu
            sources: [dt-p13]
            body: |
              **Độ nhạy**: test phát hiện đúng bao nhiêu người **có bệnh**.

              > **Độ nhạy** = dương tính thật ÷ tổng số người có bệnh

              **Độ đặc hiệu**: test xác định đúng bao nhiêu người **không có bệnh**.

              > **Độ đặc hiệu** = âm tính thật ÷ tổng số người không có bệnh
        - {id: u2-q3, kind: quiz, question: q-dt-06}
