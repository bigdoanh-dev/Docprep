- id: q-dtd-05
  stem: "Người bệnh đái tháo đường típ 2 có tăng huyết áp và protein niệu. Nhóm thuốc hạ áp nên chọn đầu tiên là?"
  options:
    - {key: a, text: "Ức chế men chuyển hoặc ức chế thụ thể", correct: true, rationale: "Là lựa chọn đầu tiên khi đã có tổn thương thận (protein niệu)."}
    - {key: b, text: "Chẹn beta", correct: false, rationale: "Không phải lựa chọn đầu tiên trong tình huống có protein niệu theo hướng dẫn."}
    - {key: c, text: "Lợi tiểu thiazide đơn trị", correct: false, rationale: "Hướng dẫn ưu tiên ức chế men chuyển hoặc ức chế thụ thể khi có protein niệu."}
    - {key: d, text: "Spironolacton", correct: false, rationale: "Spironolacton chỉ thêm ở bước sau khi phối hợp 3 thuốc chưa đạt mục tiêu."}
  explanation: "ĐTĐ có THA: điều trị theo hướng dẫn THA; ức chế men chuyển hoặc ức chế thụ thể là lựa chọn đầu tiên nếu đã có tổn thương thận (protein niệu)."
  competency_code: CI-38
  exam_competency_component: 8
  bloom_level: 2
  bloom_level_6: 3
  difficulty: trung_binh
