    - {key: c, text: "Sốt xuất huyết Dengue nặng", correct: false, rationale: "Mức nặng cần sốc, ứ dịch suy hô hấp, xuất huyết nặng hoặc suy tạng; mạch, huyết áp ở đây bình thường."}
    - {key: d, text: "Chưa phân độ được khi chưa có kết quả tiểu cầu", correct: false, rationale: "Dấu hiệu cảnh báo lâm sàng đủ để phân độ, không phải chờ xét nghiệm."}
  explanation: "Nôn ói nhiều từ 3 lần/1 giờ và đau bụng nhiều, tăng cảm giác đau vùng gan là dấu hiệu cảnh báo. Không có sốc hay suy tạng nên chưa phải SXHD nặng."
