- id: q-nd-01
  stem: "Người bệnh được đưa đến trạm y tế sau khi uống nhiều viên thuốc ngủ: hôn mê, thở chậm 8 lần/phút. Việc cần làm trước tiên là gì?"
  options:
    - {key: a, text: "Gây nôn để tống thuốc ra ngoài", correct: false, rationale: "Gây nôn chống chỉ định khi người bệnh lờ đờ, hôn mê hay co giật vì dễ sặc vào phổi."}
    - {key: b, text: "Khai thông đường thở, bảo đảm thông khí và cho thở oxy", correct: true, rationale: "Ổn định chức năng sống là ưu tiên số 1; thở chậm do thuốc ngủ là tình huống hô hấp phải xử trí ngay."}
    - {key: c, text: "Cho uống than hoạt 1 g/kg", correct: false, rationale: "Người bệnh hôn mê không uống được; khi đã có triệu chứng, ưu tiên hồi sức trước biện pháp hạn chế hấp thu."}
    - {key: d, text: "Hỏi kỹ người nhà loại thuốc rồi mới xử trí", correct: false, rationale: "Hỏi bệnh rất quan trọng cho chẩn đoán nguyên nhân nhưng không được làm chậm cấp cứu chức năng sống."}
  explanation: "Khi người bệnh đã có triệu chứng, ưu tiên nhóm 1: ổn định hô hấp, tuần hoàn, thần kinh ngay trong vài phút đầu. Thở chậm do thuốc ngủ cần khai thông đường thở, bảo đảm thông khí, thở oxy."
  competency_code: CI-06
  exam_competency_component: 9
  bloom_level: 2
  bloom_level_6: 3
  difficulty: trung_binh
  sources: [nd-p01, nd-p02]

- id: q-nd-02
  stem: "Trường hợp nào dưới đây được chỉ định gây nôn?"
  options:
