    - {key: d, text: "5 g than hoạt kèm 10 g sorbitol", correct: false, rationale: "Liều 0,1 g/kg quá thấp; liều đúng là 1 g/kg."}
  explanation: "Than hoạt 1 g/kg hòa 100 ml nước; sorbitol gấp 2 lần than hoạt. Với 50 kg: 50 g than hoạt và 100 g sorbitol."
