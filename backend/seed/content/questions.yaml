  options:
    - {key: a, text: "Sốt xuất huyết Dengue (chưa có dấu hiệu cảnh báo)", correct: false, rationale: "Nôn từ 3 lần/giờ và đau bụng nhiều vùng gan đều là dấu hiệu cảnh báo."}
