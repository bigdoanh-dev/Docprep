# Questions on the chapters of the active release, and synthetic learner profiles (dev/test only).
# rungs: Bloom level -> [answers, correct] on the passages' competencies (v2).
# v1: what the earlier personalization saw for the same learner (mastery 0–1, recall vs applied).
questions:
  - {id: Q1, text: "Các dấu hiệu cảnh báo của sốt xuất huyết Dengue là gì?"}
  - {id: Q2, text: "Phân độ tăng huyết áp tại trạm y tế xã như thế nào?"}
  - {id: Q3, text: "Chẩn đoán bệnh thương hàn dựa vào những gì?"}
  - {id: Q4, text: "Truyền dịch chống sốc trong sốc sốt xuất huyết Dengue ở trẻ em như thế nào?"}
  - {id: Q5, text: "Tiêu chuẩn chẩn đoán đái tháo đường típ 2 tại trạm y tế xã là gì?"}
  - {id: Q6, text: "Khi nào cần chuyển người bệnh viêm màng não lên tuyến trên?"}
  - {id: Q7, text: "Bù dịch cho người bệnh tiêu chảy cấp mất nước nặng như thế nào?"}
  - {id: Q8, text: "Phân loại mức độ nặng của bệnh phổi tắc nghẽn mạn tính tại trạm y tế xã?"}
profiles:
  - id: P1_nen_yeu          # holds Nhớ, stuck at Hiểu; weak prior knowledge; a known misconception
    rungs: {1: [5, 5], 2: [5, 1]}
    weak_prerequisites: true
    misconception: true
    v1: {mastery: 0.25, n_responses: 50, recall_accuracy: 0.6, applied_accuracy: 0.2}
  - id: P2_van_dung         # holds Nhớ–Hiểu, frontier Vận dụng; a known misconception
    rungs: {1: [4, 4], 2: [4, 4], 3: [5, 1]}
    misconception: true
    v1: {mastery: 0.55, n_responses: 50, recall_accuracy: 0.9, applied_accuracy: 0.4}
  - id: P3_phan_tich        # holds up to Vận dụng, frontier Phân tích
    rungs: {1: [3, 3], 2: [3, 3], 3: [4, 4], 4: [5, 1]}
    misconception: true
    v1: {mastery: 0.7, n_responses: 50, recall_accuracy: 0.9, applied_accuracy: 0.75}
  - id: P4_vung             # holds up to Đánh giá
    rungs: {1: [3, 3], 2: [3, 3], 3: [3, 3], 4: [3, 3], 5: [3, 3]}
    v1: {mastery: 0.9, n_responses: 50, recall_accuracy: 0.95, applied_accuracy: 0.9}
