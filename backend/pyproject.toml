[project]
name = "yhdp"
version = "0.1.0"
description = "Local Graph RAG study assistant for the NLHN Bác sĩ Y học dự phòng exam"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.15.1",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "tokenizers>=0.23.3",
    "typer>=0.12",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
yhdp = "yhdp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
