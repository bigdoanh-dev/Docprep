# Cấu trúc đề kiểm tra đánh giá năng lực — Bác sĩ Y học dự phòng
# Nguồn: Quyết định 51/QĐ-HĐYKQG ngày 26/8/2026 (xem blueprint.md).
# `description` là phạm vi tóm tắt dùng cho bộ gắn nhãn (tagger); bản nháp,
# cần bác sĩ duyệt (approved: true) trước khi dùng chính thức.

source: QĐ 51/QĐ-HĐYKQG (26/8/2026)
exam:
  questions: 280
  sessions: 2
  minutes_per_session: 140
  options_per_question: 4
  bloom_levels: [Áp dụng, Phân tích, Đánh giá]

mien:
  - id: 1
