name: ai-tutor-alpha-v1
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: alpha_local_only
      POSTGRES_DB: alphav1
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha -d alphav1"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
