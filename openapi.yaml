components:
  schemas:
    AccuracyByModule:
      properties:
        learners:
          type: integer
          title: Learners
          description: Consenting learners with a mock-exam answer in the period.
        items:
          items:
            $ref: '#/components/schemas/ModuleAccuracy'
          type: array
          title: Items
      type: object
      required:
      - learners
      - items
      title: AccuracyByModule
    ActivateRequest:
      properties:
        code:
          type: string
          minLength: 6
          title: Code
        device:
          anyOf:
          - $ref: '#/components/schemas/DeviceInfo'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - code
      title: ActivateRequest
      examples:
      - code: DEMO-0001
        device:
          app_version: 1.0.0
          model: Pixel 8
          platform: android
    ActivityEntry:
      properties:
        kind:
          type: string
          enum:
          - unit
          - practice
          - chat
          - cards
          - exam
          title: Kind
        title:
          type: string
          title: Title
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        minutes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Minutes
        result_vi:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Vi
      type: object
      required:
      - kind
      - title
      - occurred_at
      - minutes
      - result_vi
      title: ActivityEntry
    AdaptationSummary:
      properties:
        graded:
          $ref: '#/components/schemas/Graded'
        mastery_updated:
          anyOf:
          - $ref: '#/components/schemas/MasteryUpdated'
          - type: 'null'
        cards_created:
          anyOf:
          - $ref: '#/components/schemas/CardsCreated'
          - type: 'null'
        tomorrow:
          anyOf:
          - $ref: '#/components/schemas/Tomorrow'
          - type: 'null'
      type: object
      required:
      - graded
      - mastery_updated
      - cards_created
      - tomorrow
      title: AdaptationSummary
      description: What the set changed, from stored results. A line that does not apply is null, never a zero.
      examples:
      - cards_created:
          n: 2
        graded:
          correct: 4
          total: 6
        mastery_updated:
          competencies: 1
        tomorrow:
          reordered: true
          top_item: Đo lường tần suất bệnh
    AdminOverview:
      properties:
        period:
          type: string
          title: Period
        computed_at:
          type: string
          format: date-time
          title: Computed At
        sample_data:
          type: boolean
          title: Sample Data
          description: 'True when any learner in view is synthetic: the page shows “Dữ liệu mẫu”.'
        suppressed:
