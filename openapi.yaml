  /v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Exchange a refresh token for a new pair
      description: 'Returns a new access and refresh token and retires the old pair. Send one refresh at a time: a refresh
        token presented twice is treated as stolen and signs that device out (401 `unauthenticated`), so a client must not
        fire two refreshes in parallel or retry one whose answer it lost; sign in again in that case. A request still in flight
        with the old access token answers 401 `token_expired`: retry it with the new token.'
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      x-roles:
      - public
