openapi: 3.1.0
info:
  title: YHDP Exam Platform API
  description: 'R1.0 API of the YHDP exam-preparation platform. This file is generated from the backend; do not edit it by
    hand.


    **Conventions**


    - Every error response has the body `{"error": {"code", "message_vi", "details"}}`. The codes are listed on `ErrorDetail.code`.

    - Send the access token as `Authorization: Bearer <token>`. Each operation lists the roles it accepts in `x-roles`.

    - Until a learner has recorded the current service consent, every learner operation except those under `/v1/auth`, `/v1/consent`
    and `/v1/me` answers 403 `consent_required`.

    - Responses may gain fields and enum values in later versions: clients must ignore unknown fields and treat an unknown
    enum value as a generic case. Request bodies are strict: an unknown field is a 422.

    - A collection is returned as an object with `items`; a paginated one adds `next_cursor` (null on the last page), to be
    sent back as `cursor`.

    - Operations that take `Idempotency-Key` return the stored response when the same key is sent again.

    - UI text in responses is Vietnamese. Timestamps are UTC, ISO 8601.

    - An operation that is not implemented yet answers 501 `not_implemented`.

    '
  version: 1.0.0-draft.1
